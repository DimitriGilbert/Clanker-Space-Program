# cargo-deny: license audit only for now (PLAN §3.7). Dependency-tree bans
# live in `cargo xtask lint-deps`, which has per-crate scoping cargo-deny
# can't express cleanly across wasm splits.
[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC",
    "BSD-2-Clause", "BSD-3-Clause", "Zlib", "Unicode-3.0",
    "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "MPL-2.0", "LicenseRef-CSP-GAME",
]
copyleft = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
