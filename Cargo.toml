[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
# NOTE: license is per-crate (PLAN §1.2). Engine libs = MIT OR Apache-2.0;
# the shipped binary csp-app, data/ and apps/ = LICENSE-GAME (source-available).

# Shared dependency versions. Exact `=` pins for everything in the
# determinism domain (T3: hashes are version-sensitive); caret elsewhere.
[workspace.dependencies]
csp-core = { path = "crates/csp-core" }
csp-data = { path = "crates/csp-data" }
csp-sim = { path = "crates/csp-sim" }
csp-phys = { path = "crates/csp-phys" }
csp-view = { path = "crates/csp-view" }
csp-render = { path = "crates/csp-render" }
csp-ui = { path = "crates/csp-ui" }
csp-app = { path = "crates/csp-app" }
csp-script = { path = "crates/csp-script" }
csp-ai = { path = "crates/csp-ai" }
csp-server = { path = "crates/csp-server" }
csp-bench = { path = "crates/csp-bench" }

# determinism domain — exact pins
blake3 = "=1.8.3"
rand_chacha = "=0.10.0"
rand_core = "=0.10.1"
libm = "=0.2.16"
bincode = { version = "=2.0.1" }
ciborium = "=0.2.2"
# M9a §2.10 — the guest language host. Pinned feature set per the
# plan's parity rule: NOT `unchecked` (that would disable
# `max_operations`/progress tracking = no budget enforcement), NOT
# `only_i32`, NOT `f32_float` (web would be a different language),
# `sync` OFF (its default). `no_std` is the determinism pin: it
# bundles `no_time` (no BasicTimePackage — `timestamp()`/`elapsed`
# cannot exist, so the guest has no wall clock) and `num-traits/libm`
# + `libm` (every transcendental resolves to libm, not the platform
# libm — the cross-platform float-determinism rule the sim itself
# already enforces). Exact pin — script semantics are
# version-sensitive like every determinism-domain dep.
rhai = { version = "=1.27.0", default-features = false, features = ["no_std"] }
# Pinned at the newest published 0.9.x (the original "=0.9.8" declaration
# predated any use and names a version that does not exist on crates.io;
# 0.9.1 is what Cargo.lock already carries transitively).
miniz_oxide = "=0.9.1"
# PLAN §2.7: declared NOW so M2's csp-phys cannot get the feature set wrong.
# `default-features = false`, `enhanced-determinism` ON (mutually exclusive
# with `simd8`/`simd-nightly`, both OFF), `parallel` OFF (it pulls rayon).
# `required-features`/`dim3`/`f64`/`std` restore the minimal usable surface
# that `default-features = false` strips (parry's default is
# required-features+std+spade; rapier's is dim3+f64+std+block-solver).
# Pins are the newest versions ≥7 days old at declaration time
# (parry 0.31.1 @2026-09-18, rapier 0.36.1 @2026-10-10; rapier 0.36.1
# requires parry ^0.31.1, so the pair is coherent). Workspace declaration
# only — no crate depends on these yet.
parry3d-f64 = { version = "=0.31.1", default-features = false, features = [
    "required-features",
    "std",
    "enhanced-determinism",
] }
rapier3d-f64 = { version = "=0.36.1", default-features = false, features = [
    "dim3",
    "f64",
    "std",
    "enhanced-determinism",
] }

# shared non-deterministic deps
bevy_ecs = { version = "0.20.0", default-features = false }
# Presentation-side vertex packing (csp-render): already in the tree via
# wgpu; declared so csp-render's vertex structs can derive Pod.
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "30", default-features = true }
# `default_fonts` is explicit: egui 0.37's `default` feature is EMPTY —
# without it no font data is bundled and the first text layout panics
# ("No font provider has any font for FontFamily::Proportional").
# `epaint_default_fonts` is pure embedded data — wasm-safe (egui's own
# web demo ships it).
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false }
winit = "0.30.13"
pollster = "1.0.1"
web-time = "1.1.0"
serde = "1"
# Human-readable sidecars (the §7.1 determinism fingerprint file). Not in
# the determinism domain — never hashed — so a caret range is honest.
serde_json = "1"
# RON is the data/ file format (§3.x). Workspace-declared now for the
# csp-data loader (M1) and xtask's data-validation tests.
ron = "0.12.2"

# platform glue (csp-app only)
env_logger = "0.11.11"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
log = "0.4.34"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
cognitive_complexity = { level = "warn", priority = -1 }
type_complexity = { level = "warn", priority = -1 }
too_many_lines = { level = "warn", priority = -1 }
too_many_arguments = { level = "warn", priority = -1 }
# PLAN §2.13: unwrap/expect on fallible paths in the determinism domain is a
# CI lint failure. Denied workspace-wide; the four determinism crates have
# NO exceptions. Legitimate uses (presentation init in csp-app, xtask
# tooling, test code) carry narrow-scoped #[allow]s with stated reasons.
unwrap_used = "deny"
expect_used = "deny"
