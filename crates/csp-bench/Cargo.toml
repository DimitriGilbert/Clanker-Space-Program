[package]
name = "csp-bench"
version = "0.0.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
csp-core = { workspace = true }
csp-data = { workspace = true }
csp-sim = { workspace = true }
# M9a §2.10: the replay harness re-installs the same construction-
# config engines `csp-view` does (script host + autopilot driver).
csp-script = { workspace = true }
csp-ai = { workspace = true }
# The flight scenario's authored part set + environment come from the
# weld/weld-input types; the harness measures `SimpleBackend::step` cost
# directly (§5.3's per-tick budget).
csp-phys = { workspace = true }
# M9c §2.12.1: `csp-mcp` — the stdio MCP bin — drives a headless sim
# through the interface tier's transport-free engine + LocalGame host
# (native-only, like this crate).
csp-server = { workspace = true }
# Scripted-controller math (atan2/acos/apsis estimates) — deterministic
# math only, matching the sim's own rule.
libm = { workspace = true }
# §5.4's VAB-latency perf row measures the real op+frame path — the
# session lives in csp-ui and the frame pipeline in csp-view (C17-F5).
# Native-only crate; these edges never reach a wasm tree.
csp-ui = { workspace = true }
csp-view = { workspace = true }
# §3.1 fixture hashing (the replay artifact's data_fixture_hash).
blake3 = { workspace = true }
# §7.6: replay logs stay bincode, version-scoped by T3. `serde` feature for
# the serde-bridge codec (encode_to_vec/decode_from_slice).
bincode = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
# The §7.1 fingerprint sidecar (fingerprint.json) — a diagnostic artifact,
# never hashed.
serde_json = { workspace = true }
# M9d §2.12.1: the declarative scenario format (scenario.ron) — the same
# codec the fixture data files use.
ron = { workspace = true }

[lints]
workspace = true
