[package]
name = "csp-ai"
version = "0.0.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
# §2.10: the AutopilotDriver seam + telemetry/command types.
csp-sim = { workspace = true }
# The ControlApi the driver flies through (IoControlApi over TickIo).
csp-script = { workspace = true }
# Vectors for the guidance math.
csp-core = { workspace = true }
# §2.10's transcendental rule: libm only, never platform floats.
libm = { workspace = true }

[dev-dependencies]
# The world-level tests build a real bubble: `Environment`/weld inputs
# (csp-phys) and `BodyId`/element types (csp-data).
csp-phys = { workspace = true }
csp-data = { workspace = true }

[lints]
workspace = true
