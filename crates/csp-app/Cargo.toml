[package]
name = "csp-app"
version = "0.0.0"
edition.workspace = true
license = "LicenseRef-CSP-GAME"
# The shipped game binary (PLAN §1.2): proprietary, never published. Also
# keeps cargo-deny's license check out of LicenseRef-CSP-GAME's way
# ([licenses] private.ignore in deny.toml).
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "csp"
path = "src/main.rs"

[dependencies]
csp-core = { workspace = true }
csp-render = { workspace = true }
csp-view = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true, features = ["links", "wayland", "x11"] }
pollster = { workspace = true }
web-time = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }

[lints]
workspace = true
