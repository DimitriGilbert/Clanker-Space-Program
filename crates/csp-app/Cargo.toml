[package]
name = "csp-app"
version = "0.0.0"
edition.workspace = true
license = "LicenseRef-CSP-GAME"
# The shipped game binary (PLAN §1.2): proprietary, never published. Also
# keeps cargo-deny's license check out of LicenseRef-CSP-GAME's way
# ([licenses] private.ignore in deny.toml).
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "csp"
path = "src/main.rs"

[dependencies]
csp-core = { workspace = true }
csp-render = { workspace = true }
# NOTE: no direct csp-sim edge — §2.1 gives only csp-view the
# both-sim-and-render bridge; the app names sim types through
# `csp_view`'s re-exports (`VesselId`, `events`, `orbit`, `save`).
csp-view = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true, features = ["links", "wayland", "x11"] }
pollster = { workspace = true }
web-time = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
# `log` is the reporting channel for the sim's rejected/degraded
# diagnostics (AdvanceReport) on every target — env_logger on native,
# console_log on wasm.
log = { workspace = true }
# §7.8: the settings sidecar is RON, same format as data/ (native file
# IO only — the dep itself is wasm-clean).
ron = { workspace = true }
# §2.14: the bug-report bundle's fingerprint sidecar is JSON like the
# §8.4 goldens' — not in the determinism domain, caret is honest.
serde_json = { workspace = true }

[dev-dependencies]
# Tests drive `VabSession` ops (`VabAction`) directly — csp-view only
# re-exports the session wrapper, not the action vocabulary.
csp-ui = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }
# §2.12's shipped hosting path — `csp --serve` runs GameHost +
# Server::start against the packaged telemetry SPA. NATIVE ONLY:
# the wasm tree must never see axum/tokio (§8.2's wasm-purity gate).
csp-server = { workspace = true }

[lints]
workspace = true
