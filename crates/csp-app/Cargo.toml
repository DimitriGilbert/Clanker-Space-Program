[package]
name = "csp-app"
version = "0.0.0"
edition.workspace = true
license = "LicenseRef-CSP-GAME"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "csp"
path = "src/main.rs"

[dependencies]
csp-core = { version = "0.0.0", path = "../csp-core" }
csp-render = { version = "0.0.0", path = "../csp-render" }
csp-view = { version = "0.0.0", path = "../csp-view" }
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false, features = ["links", "wayland", "x11"] }
pollster = "1.0.1"
web-time = "1.1.0"
wgpu = "30"
winit = "0.30.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
log = "0.4.34"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"

[lints]
workspace = true
