[package]
name = "csp-sim"
version = "0.0.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
csp-core = { workspace = true }
# §2.1 allowlist: the orbit layer reuses csp-data's `BodyId`/`KeplerElements`
# (the §3.0 schema types) rather than redeclaring them sim-side.
csp-data = { workspace = true }
# §2.4/§2.9: the bubble's weld inputs (`PartGraph`/`EffectivePart`),
# `WeldedBody`, and the `SimpleBackend` + `Environment` the World steps.
csp-phys = { workspace = true }
# §2.7: libm-only transcendentals — every sin/cos/atan2/sqrt in the orbit
# layer goes through it (crate clippy.toml bans the f64 methods).
libm = { workspace = true }
# PLAN §2.1 allow-lists serde for csp-sim: the §7.6 replay artifact serializes
# command types via bincode. Serialization never feeds the §7.1 state hash —
# that is produced by the StateHasher visitor, so serde field order is free.
serde = { workspace = true, features = ["derive"] }
# §7.7: the versioned save format's wire container is the §7.2-adjudicated
# `CSPSAVE\0` + u32 header_len + JSON header + DEFLATE-over-CBOR body —
# ciborium (canonical CBOR) + miniz_oxide (zlib-framed DEFLATE, the same
# codec the csp-data PNG decoder uses) + serde_json for the self-describing
# header. Exact pins — the wire format is part of the save contract, not a
# negotiated encoding. bincode stays for the §7.6 command-log artifact only
# (§7.2: "replay logs stay bincode").
bincode = { workspace = true, features = ["serde"] }
ciborium = { workspace = true }
miniz_oxide = { workspace = true }
serde_json = { workspace = true }
# §2.7: the M7-D contract generator consumes csp_core's deterministic
# streams in shipping code — `RngCore::next_u64` is the draw source.
rand_core = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
