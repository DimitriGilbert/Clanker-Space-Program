[package]
name = "csp-view"
version = "0.0.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
csp-core = { workspace = true }
csp-sim = { workspace = true }
# M9a §2.10: the script host + ascent autopilot installed on every
# sim the app builds (construction config — §7.3).
csp-script = { workspace = true }
csp-ai = { workspace = true }
# §8.3: balance.ron/system data files ARE the sim world's startup
# configuration — `View::new` loads them (native).
csp-data = { workspace = true }
# The UiBuild schedule's systems call csp-ui's pure panel fns; egui types
# ride presentation resources (RawInput in, FullOutput out — §2.5).
csp-ui = { workspace = true }
# §2.1: csp-view is the ONLY crate allowed to depend on both csp-sim and
# csp-render — RenderExtract builds csp_render::map::MapPacket here.
csp-render = { workspace = true }
# VAB session types (`PartNodeId`, `PartTransform`) ride vab events and
# the craft-view scene — csp-phys is already in this crate's tree via
# csp-sim; the direct edge names what the VAB systems touch.
csp-phys = { workspace = true }
egui = { workspace = true }
bevy_ecs = { workspace = true, features = ["std"] }
# .csar art-pack decode (data/art/) — real models + textures.
miniz_oxide = { workspace = true }
# Degradation logging for the map extract path (a skipped orbit line is
# a presentation fallback, §2.13's honest-channel class — warned, never
# halted). No-op without a logger; wasm-safe.
log = { workspace = true }

# PLAN §2.5: multi_threaded executor is a NATIVE-only feature (fixup 10).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_ecs = { workspace = true, features = ["std", "multi_threaded", "async_executor"] }

[dev-dependencies]
# tests/render_gate.rs — the headless render verification (no surface):
# wgpu for the surfaceless adapter/device + offscreen texture readback,
# pollster to drive the async requests on a test thread. Dev-deps only —
# the shipped tree never links them, and lint-deps scopes to
# normal,build edges.
pollster = { workspace = true }
wgpu = { workspace = true }
# tests/render_gate.rs — the scratch surface dump places an eye with
# f64 world vectors (csp-core DVec3, already a normal dep).
csp-core = { workspace = true }
# tests/demo.rs — parse the demo's embedded en.ron into csp_data::LocFile
# for the loc-key validation gates (same dependency the csp-data
# integration tests declare for the same purpose).
ron = { workspace = true }

[lints]
workspace = true
