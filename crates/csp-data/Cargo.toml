[package]
name = "csp-data"
version = "0.0.0"
edition.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
# §3.x data defs are RON; the loader/validator needs nothing else from the
# platform. libm only for transcendentals (§8.2 determinism lints) — the
# period check uses libm::sqrt.
# csp-core for DVec3/DQuat — part attach nodes, bounding boxes, and
# collider geometry are 3-vectors (§3.1 PartDef), and the types must be
# the same ones csp-phys consumes downstream.
csp-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
ron = { workspace = true }
libm = { workspace = true }
# The §3.1 data-set hash (data_set_hash) — same pinned construction as the
# csp-bench fixture hash, different scope (see datahash module docs).
blake3 = { workspace = true }
# Biome-map pixel decode (biome::decode_indexed_png — R2 terrain seeding):
# zlib inflate only; deterministic, already workspace-pinned.
miniz_oxide = { workspace = true }

[dev-dependencies]
# Integration tests drive the loader/validator over the real data/ tree:
# ron to parse en.ron, libm for the derived-check formulas (this crate's
# clippy.toml bans f64::sqrt in test code too), blake3 for the empty-hash
# comparison.
ron = { workspace = true }
libm = { workspace = true }
blake3 = { workspace = true }

[lints]
workspace = true
