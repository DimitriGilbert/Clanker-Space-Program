name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (native)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test (native)
        run: cargo test --workspace

      # wasm gate: exclude native-only crates (csp-server, csp-bench) so the
      # gate survives axum/tokio landing, and assert wasm purity positively.
      - name: check (wasm32) — never merge a broken web build
        run: |
          cargo check --workspace --exclude csp-server --exclude csp-bench \
            --target wasm32-unknown-unknown

      - name: dependency rules + wasm purity + attribution
        run: |
          cargo run -p xtask -- lint-deps
          cargo run -p xtask -- lint-attribution

      # §8.2 cargo-deny gate: license allowlist + global bans (deny.toml).
      # cargo-deny is a prebuilt binary install; NOTE it is not vendored in
      # this workspace, so this step could not be pre-verified locally —
      # if the pin misbehaves on first CI run, adjust here.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (licenses + bans)
        run: cargo deny check

      # §8.2 golden replays — the M0 fast subset is one scenario. The
      # workspace test run above already covers the in-process round-trips;
      # this step runs the strict `verify_golden` path (fixture freeze,
      # sidecar agreement, replay verdict) against the committed artifacts.
      - name: golden replays (M0 subset)
        run: cargo run -p csp-bench --bin csp-replay -- verify data/test-fixtures/trivial
