name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (native)
        run: cargo clippy --workspace -- -D warnings

      - name: test (native)
        run: cargo test --workspace

      # wasm gate: exclude native-only crates (csp-server, csp-bench) so the
      # gate survives axum/tokio landing, and assert wasm purity positively.
      - name: check (wasm32) — never merge a broken web build
        run: |
          cargo check --workspace --exclude csp-server --exclude csp-bench \
            --target wasm32-unknown-unknown

      - name: dependency rules + wasm purity + attribution
        run: |
          cargo run -p xtask -- lint-deps
          cargo run -p xtask -- lint-attribution
