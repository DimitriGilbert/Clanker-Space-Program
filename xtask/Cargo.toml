[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false
# `cargo run -p xtask -- <task>` must keep resolving to the lint harness
# now that src/bin/gen_biome_maps.rs is a second binary.
default-run = "xtask"

[dependencies]
# bless-goldens re-records scenarios through the harness itself rather than
# shelling out to `cargo run` — one process, no nested cargo.
csp-bench = { workspace = true }
# lint-deps derives the workspace member list from `cargo metadata` —
# hand-maintaining it would let a new member pass unwalked.
serde_json = { workspace = true }
# bake_art (src/bin/bake_art.rs): source-image decode (JPG source textures,
# Radiance .hdr sky) + DEFLATE for the .csar packs. `default-features=false`
# keeps image's `rayon` pullout off — deny.toml bans rayon workspace-wide.
# Both versions are already pinned in Cargo.lock transitively.
image = { version = "=0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "hdr",
] }
miniz_oxide = { workspace = true }

[dev-dependencies]
# lint-deps tests prove data/*.ron files parse with the real RON reader —
# the "valid RON" hygiene gate is a parse, not a regex.
ron = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
