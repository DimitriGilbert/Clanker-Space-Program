<!doctype html>
<!-- §6.3 web-demo shell (M10-C). `cargo xtask build-web` produces
     `apps/demo/dist/` — this file beside `csp_app.js` +
     `csp_app_bg.wasm`. Serve statically, e.g.:
         cargo xtask build-web && python3 -m http.server -d apps/demo/dist
     The §6.3 contract — Terrin only, ≤60 parts, no save — is enforced
     in the VAB session and the app shell, not here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clanker Space Program — Web Demo</title>
<style>
  html, body { margin: 0; padding: 0; background: #05060a; min-height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #8a93a6;
    font: 14px/1.4 system-ui, sans-serif;
  }
</style>
</head>
<body>
<div id="loading">loading the §6.3 demo…</div>
<div id="fallback" hidden>
  <h1>Clanker Space Program — Web Demo</h1>
  <p id="fallback-reason"></p>
  <p class="dim">The demo needs a browser with WebGPU — Chrome/Edge 113+, Firefox 141+, or Safari 26+.</p>
</div>
<style>
  #fallback {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: #c6cede; font: 15px/1.5 system-ui, sans-serif; text-align: center;
    padding: 0 24px;
  }
  #fallback[hidden] { display: none; }
  #fallback h1 { font-size: 20px; font-weight: 600; margin: 0; }
  #fallback .dim { color: #8a93a6; }
</style>
<script type="module">
  // csp-app's wasm entry point is `wasm_start` (#[wasm_bindgen(start)])
  // — `init()` instantiates the module and runs it; winit appends its
  // canvas to <body>. A no-WebGPU browser used to fall through to a
  // silent black canvas (vision-report 7.1/7.2): say so instead.
  //
  // GPU init resolves AFTER `init()` — the adapter/device requests are
  // browser promises spawned onto the winit loop — so csp-app reports
  // the outcome through the `cspGpuInitFailed`/`cspGpuReady` hooks
  // below (it also sets `__csp_gpu_init_error`/`__csp_gpu_ready` for
  // anything that prefers polling). Until the ready hook fires the
  // loading screen stays up; the failure hook swaps in #fallback.
  const fail = (msg) => {
    document.getElementById('loading')?.remove();
    const f = document.getElementById('fallback');
    f.hidden = false;
    document.getElementById('fallback-reason').textContent = msg;
  };
  window.cspGpuInitFailed = (msg) => fail(`GPU init failed: ${msg}`);
  window.cspGpuReady = () => document.getElementById('loading')?.remove();
  // A wasm-side panic in an event handler can't propagate to the
  // `await init()` catch — it surfaces as an uncaught error (wasm
  // traps) or a stray rejection instead. Both mean the demo is dead;
  // say so rather than leave the void.
  window.addEventListener('unhandledrejection', (e) => {
    fail(`demo crashed: ${e.reason}`);
  });
  window.addEventListener('error', (e) => {
    if (!window.__csp_gpu_ready) {
      fail(`demo crashed: ${e.message}`);
    }
  });
  if (!navigator.gpu) {
    fail('This browser has no WebGPU support — the demo cannot start its renderer.');
  } else {
    try {
      const init = (await import('./csp_app.js')).default;
      await init();
      // Watchdog: hooks are installed before this resolves and fire on
      // the app's own loop — silence for 30 s means the GPU promise
      // never landed, which is the black-void failure mode.
      setTimeout(() => {
        if (!window.__csp_gpu_ready && !window.__csp_gpu_init_error) {
          fail('GPU init never resolved — the demo could not start its renderer.');
        }
      }, 30000);
    } catch (e) {
      fail(`demo failed to start: ${e}`);
      throw e;
    }
  }
</script>
</body>
</html>
